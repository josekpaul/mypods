<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podcast Player</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#635bff">
<link rel="stylesheet" href="css/style.css">

<header>
  <h1>Podcast Player</h1>
  <div id="generated-at"></div>
  <nav class="view-tabs">
    <button class="view-tab active" id="tab-browse" data-view="browse">Browse</button>
    <button class="view-tab" id="tab-playlist" data-view="playlist">Playlist</button>
    <button class="view-tab" id="tab-settings" data-view="settings">Settings</button>
  </nav>
  <div class="filters" id="browse-filters">
    <select id="filter-category">
      <option value="all">All categories</option>
    </select>
    <label><input type="checkbox" id="filter-downloaded"> Downloaded only</label>
    <label><input type="checkbox" id="filter-unplayed"> Unplayed only</label>
    <button id="refresh-btn">Refresh</button>
  </div>
</header>

<main id="episode-list"></main>
<main id="playlist-list" class="hidden"></main>
<main id="settings-view" class="hidden">
  <section class="settings-section">
    <h2>Episode list source</h2>
    <p class="settings-note">
      Point the app at any episodes.json URL to use your own curated list instead of the
      default feed. The URL must be reachable from your browser (same-origin or CORS-enabled).
    </p>
    <label class="settings-field">
      <span>Feed URL</span>
      <input type="url" id="settings-feed-url" placeholder="./data/episodes.json" inputmode="url">
    </label>
    <div class="settings-actions">
      <button id="settings-save-btn">Save &amp; Refresh</button>
      <button id="settings-reset-btn" class="secondary-btn">Reset to default</button>
    </div>
    <p class="settings-status" id="settings-status"></p>
  </section>
</main>

<div id="player-bar" class="hidden">
  <div>
    <div class="now-playing-title" id="now-playing-title"></div>
    <div class="now-playing-show" id="now-playing-show"></div>
  </div>
  <audio id="audio-el" controls></audio>
</div>

<script type="module" src="js/app.js"></script>
